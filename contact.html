 <header class="header">

         <h1 class="contact-heading">Get in touch with us</h1>
         <div class="contact-container">
             <a href="https://facebook.com/LeMARCHE" class="contact-card" target="_blank" rel="noopener noreferrer">

                 <h2 class="contact-title">Facebook</h2>
                 <p class="contact-desc">Send a message or follow our page for updates</p>
             </a>

             <a href="https://instagram.com/LeMARCHE" class="contact-card" target="_blank" rel="noopener noreferrer">
                 <i class="fab fa-instagram contact-icon"></i>
                 <h2 class="contact-title">Instagram</h2>
                 <p class="contact-desc">Check out our latest posts and stories</p>
             </a>

             <a href="tel:+1234567890" class="contact-card">
                 <i class="fas fa-phone contact-icon"></i>
                 <h2 class="contact-title">Phone</h2>
                 <p class="contact-desc">+213 555-40-57-48</p>
             </a>
